[package]
name = "cabra"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.0"

[dev-dependencies]
criterion = "0.5.1" # newer versions not supported by pprof + flamegraph
pprof = { version = "0.15.0", features = [ "criterion", "flamegraph" ] }

[[bench]]
name = "caminos"
harness = false

[profile.bench]
debug = true
