[package]
name = "cabra"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
chacha20 = "0.10.0"
rand = "0.10.0"
ratatui = "0.30.0"
rayon = "1.12.0"
rustc-hash = "2.1.2"

[dev-dependencies]
criterion = "0.5.1" # newer versions not supported by pprof + flamegraph
pprof = { version = "0.15.0", features = [ "criterion", "flamegraph" ] }

[[bench]]
name = "caminos"
harness = false

[profile.bench]
debug = true
